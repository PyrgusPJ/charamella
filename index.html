<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheda personaggio D&D 2024</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef0ee;--card:#f9faf8;--ink:#1f2a33;--mut:#5d6b73;--line:#b4bdbb;--acc:#7a1f2b;--accbg:#f1dfe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171c20;--card:#1f262b;--ink:#e6eae8;--mut:#9aa7ad;--line:#3a464d;--acc:#e08a94;--accbg:#3a2428}}
:root[data-theme="dark"]{--paper:#171c20;--card:#1f262b;--ink:#e6eae8;--mut:#9aa7ad;--line:#3a464d;--acc:#e08a94;--accbg:#3a2428}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
main{max-width:1100px;margin:0 auto;padding:12px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:transparent;border:0;border-bottom:1px solid var(--line);padding:3px 2px;min-width:0;width:100%;border-radius:0}
textarea{border:1px solid var(--line);border-radius:6px;padding:6px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button.p{background:var(--acc);color:var(--paper);border-color:var(--acc)}
button.g{border:0;background:none;color:var(--mut);padding:2px 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:22px}
.hd{display:grid;grid-template-columns:96px 2fr repeat(4,1fr) 70px;align-items:start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
label{font-size:13px;color:var(--mut);display:block}
.grid{display:grid;grid-template-columns:230px 1fr 1fr;gap:12px;margin-top:12px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.box h2{font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.abc{border:1px solid var(--line);border-radius:8px;padding:4px 6px;text-align:center}
.abc b{font:700 22px Fraunces,serif;display:block;color:var(--acc)}
.abc input{text-align:center;border:0;font-weight:600}
.row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:15px}
.row span.n{flex:1}.row span.v{width:32px;text-align:right;font-weight:600}
.pip{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:50%;background:none;padding:0;flex:none}
.pip.on{background:var(--acc);border-color:var(--acc)}.pip.ex{background:var(--acc);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--acc)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.stats>div{border:1px solid var(--line);border-radius:8px;padding:6px 4px}
.stats input{text-align:center;font:700 20px Fraunces,serif;border:0}
.hp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;text-align:center}
.hp input{text-align:center;font-size:18px;font-weight:600}
.atk{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:6px;margin-bottom:4px}
.ent{border-top:1px solid var(--line);padding:4px 0}
.ent summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none}
.ent summary::-webkit-details-marker{display:none}
.ent summary b{flex:1}.ent summary i{color:var(--mut);font-size:13px;font-style:normal}
.ent .ed{display:grid;gap:6px;padding:6px 0 8px}.ent .ed div{display:flex;gap:6px}
.lv{font:600 13px Fraunces,serif;color:var(--acc);margin:8px 0 0}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.slots div{border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:13px;text-align:center}
.slots input{width:34px;text-align:center;display:inline-block}
.sp{display:flex;gap:10px;font-size:14px;margin-bottom:6px;flex-wrap:wrap}.sp select{width:auto}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:560px;width:calc(100% - 24px);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.cat{max-height:260px;overflow:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px}
.cat button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0}
.cat small{color:var(--mut);display:block}
.auto{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--mut)}.auto input{width:auto}.auto label{display:flex;gap:6px;align-items:center;margin:0;width:auto}.qty{display:flex;gap:2px;align-items:center}.qty b{min-width:22px;text-align:center}
.atkw{border-top:1px solid var(--line);padding:6px 0}.atk2{display:grid;grid-template-columns:1fr 52px 1.4fr auto;gap:6px;align-items:center}.sub{display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0}.sub select{width:auto}.sub label{display:flex;gap:4px;align-items:center;width:auto}
.slots .cc{border:2px solid var(--acc);border-radius:8px;padding:3px 8px;background:var(--accbg)}.slots .cc label{color:var(--acc);font-weight:600}.ccb{display:flex;gap:4px;align-items:center;justify-content:center}.slots .ccb input{width:52px;text-align:center;font-weight:700}
.dvr{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:8px}.res{display:flex;align-items:center;gap:8px;padding:3px 0;border-top:1px solid var(--line)}.res .n{flex:1}.res small{color:var(--mut)}
.star{background:none;border:0;padding:0 2px;font-size:18px;line-height:1;color:var(--line);cursor:pointer}.star.on{color:var(--acc)}.star:hover:not(:disabled){color:var(--acc)}.star:disabled{opacity:.35;cursor:not-allowed}
.ds{margin-top:8px}.dsr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}.dsr .pip.on{background:#2e7d4f;border-color:#2e7d4f}.dsr .pip.f.on{background:#b3261e;border-color:#b3261e}
.port{display:flex;flex-direction:column;align-items:center;gap:4px}.pbox{width:96px;height:120px;border:1px dashed var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center;font-size:12px;color:var(--mut);background:var(--paper);margin:0}.pbox img{width:100%;height:100%;object-fit:cover;display:block}
.sum{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:12px}.sumc{min-width:0}
.fm{border-top:1px solid var(--line);padding:6px 0;display:grid;gap:2px}.fm small{display:block}.fb{display:flex;gap:6px;align-items:center;margin-top:4px}.fmact{background:var(--accbg);border:1px solid var(--acc);border-radius:8px;padding:6px 8px;margin-bottom:6px}
.glf{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px}@media(max-width:860px){.glf{grid-template-columns:1fr}}
.hdbox{padding:12px}.hdbox .hd{background:none;border:0;padding:0;border-radius:0}.hdbox .sum{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;background:var(--paper)}.chip .g{padding:0 4px}
.cstats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cst{border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--paper)}.cst small{color:var(--mut);margin-right:5px}.cst b{font-family:Fraunces,Georgia,serif;color:var(--acc)}
#lockov{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}.lockbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:340px;width:100%}.lockbox h2{margin-bottom:6px}
.empty{color:var(--mut);font-size:14px}
@media(max-width:860px){.sum{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.hd{grid-template-columns:1fr 1fr}.hd>.port{grid-column:1/-1}.hd>:nth-child(2){grid-column:1/-1}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Scheda personaggio · D&amp;D 2024</h1>
<div><small id="sync" class="empty">Salvata su questo dispositivo</small> <button id="sc">Sicurezza</button> <button id="vf">Verifica</button> <button id="gl">Glossario</button> <button id="th">Personalizza</button> <button id="pr">Stampa / scarica</button> <button id="rb">Riposo breve</button> <button id="rl">Riposo lungo</button> <button id="bk">Backup / ripristina</button> <select id="chs" title="Personaggio" style="width:auto;max-width:190px"></select> <button id="cn">+ Nuovo</button> <button id="cd">Duplica</button> <button id="cx" class="g">Elimina</button> <button id="rs" class="g">Azzera</button></div></div>
<div id="app"></div>
</main>

<dialog id="dlg"><div id="dc"></div></dialog>

<script>
const AB=[['for','Forza'],['des','Destrezza'],['cos','Costituzione'],['int','Intelligenza'],['sag','Saggezza'],['car','Carisma']];
const SK=[['Acrobazia','des'],['Addestrare Animali','sag'],['Arcano','int'],['Atletica','for'],['Furtività','des'],['Indagare','int'],['Inganno','car'],['Intimidire','car'],['Intrattenere','car'],['Intuizione','sag'],['Medicina','sag'],['Natura','int'],['Percezione','sag'],['Persuasione','car'],['Rapidità di Mano','des'],['Religione','int'],['Sopravvivenza','sag'],['Storia','int']];
const LISTS={spells:'Incantesimi',feats:'Talenti',features:'Tratti e privilegi',items:'Equipaggiamento'};
const KEY='scheda-dnd-2024';
const blank=()=>({i:{nome:'',classe:'',sottoclasse:'',specie:'',background:'',livello:1,auto:true,ca:10,vel:'9 m',pf:0,pfmax:0,pft:0,dv:'',ispirazione:0,car:'int',monete:''},
 a:{for:10,des:10,cos:10,int:10,sag:10,car:10},sv:{},sk:{},slots:{},atk:[],spells:[],feats:[],features:[],items:[],res:[],notes:'',lib:[]});
const lk=id=>id==='main'?KEY:KEY+'|'+id,dname=id=>id==='main'?'sheet':'ch_'+id;
let LOCKCFG=null;try{LOCKCFG=JSON.parse(localStorage.getItem(KEY+'_lock'))}catch(e){}
let LOCKED=!!(LOCKCFG&&LOCKCFG.salt),ENC=null;
let IDX=null;if(!LOCKED){try{IDX=JSON.parse(localStorage.getItem(KEY+'_idx'))}catch(e){}}
if(!IDX||!Array.isArray(IDX.list)||!IDX.list.length)IDX={cur:'main',list:[{id:'main',n:''}],ts:0};
if(!IDX.list.some(x=>x.id===IDX.cur))IDX.cur=IDX.list[0].id;
let CID=IDX.cur;
let S;if(!LOCKED){try{S=JSON.parse(localStorage.getItem(lk(CID)))||blank()}catch(e){S=blank()}}else S=blank();
S=Object.assign(blank(),S);if(!S.res)S.res=[];if(S.i.auto===undefined)S.i.auto=true;S.items.forEach(e=>{if(e.q==null){const x=qi(e.n);e.n=x.n;e.q=x.q;if(e.o)e.o.n=qi(e.o.n).n}});
let CL=null,TS=0,ptm=null,itm=null,busy=false,DBH=null,UIDV=null,wq=Promise.resolve();try{TS=+localStorage.getItem(lk(CID)+'_ts')||0}catch(e){}
const setSt=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};
const cdoc=id=>DBH.doc('data/users/'+UIDV+'/'+dname(id)),idoc=()=>DBH.doc('data/users/'+UIDV+'/index'),ldoc=()=>DBH.doc('data/users/'+UIDV+'/lock');
/* --- cifratura (AES-GCM, chiave da password con PBKDF2) --- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pw,cfg){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(cfg.salt),iterations:cfg.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encWith(key,str){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(str)));return 'ENC1:'+b64(iv)+':'+b64(ct)}
async function decWith(key,s){const[,iv,ct]=String(s).split(':');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct)))}
const packDoc=async(js,ts)=>ENC?{ts,enc:await encWith(ENC,js)}:{ts,json:js};
async function unpackDoc(d){if(!d)return null;if(d.enc){if(!ENC)return null;try{return await decWith(ENC,d.enc)}catch(e){return null}}return d.json||null}
async function readKey(k){let v=null;try{v=localStorage.getItem(k)}catch(e){}if(!v)return null;if(v.startsWith('ENC1:')){if(!ENC)return null;try{return JSON.parse(await decWith(ENC,v))}catch(e){return null}}try{return JSON.parse(v)}catch(e){return null}}
const readLocal=id=>readKey(lk(id));
function persist(){const id=CID,ts=TS,js=JSON.stringify(S);if(!ENC){try{localStorage.setItem(lk(id),js);localStorage.setItem(lk(id)+'_ts',String(ts))}catch(e){}return}
 wq=wq.then(async()=>{try{localStorage.setItem(lk(id),await encWith(ENC,js));localStorage.setItem(lk(id)+'_ts',String(ts))}catch(e){}})}
const save=()=>{if(LOCKED)return;TS=Date.now();persist();
 const en=IDX.list.find(x=>x.id===CID);if(en&&(en.n||'')!==(S.i.nome||'')){en.n=S.i.nome||'';saveIdx()}cloudQueue();updChars()};
function persistIdx(){const js=JSON.stringify(IDX);if(!ENC){try{localStorage.setItem(KEY+'_idx',js)}catch(e){}return}wq=wq.then(async()=>{try{localStorage.setItem(KEY+'_idx',await encWith(ENC,js))}catch(e){}})}
function saveIdx(){if(LOCKED)return;IDX.ts=Date.now();persistIdx();if(!DBH)return;clearTimeout(itm);itm=setTimeout(async()=>{try{await idoc().set(await packDoc(JSON.stringify(IDX),IDX.ts))}catch(e){}},1200)}
function cloudQueue(){if(!CL||LOCKED)return;clearTimeout(ptm);ptm=setTimeout(cloudPush,1500)}
async function cloudPush(){if(!CL||LOCKED)return;if(busy){cloudQueue();return}busy=true;ptm=null;try{await CL.set(await packDoc(JSON.stringify(S),TS));setSt('Salvata sul tuo account ✓')}catch(e){setSt('Salvataggio sull\'account non riuscito: la scheda resta su questo dispositivo')}busy=false}
function normS(o){S=Object.assign(blank(),o);if(!S.res)S.res=[];if(S.i.auto===undefined)S.i.auto=true}
function updChars(){const s=document.getElementById('chs');if(!s)return;s.innerHTML=IDX.list.map(x=>`<option value="${esc(x.id)}" ${x.id===CID?'selected':''}>${esc(x.n||'Senza nome')}</option>`).join('')}
async function loadChar(id){const o=await readLocal(id);CID=id;IDX.cur=id;normS(o||{});try{TS=+localStorage.getItem(lk(id)+'_ts')||0}catch(e){TS=0}CL=DBH?cdoc(id):null}
function shareFrom(p){if(!p)return;S.gloss={...(S.gloss||{}),...(p.gloss||{})};const gx=[...(S.glx||[])];(p.glx||[]).forEach(x=>{if(!gx.some(y=>y.n===x.n&&y.d===x.d))gx.push(x)});S.glx=gx;const lb=[...(S.lib||[])];(p.lib||[]).forEach(x=>{if(!lb.some(y=>y.t===x.t&&y.n===x.n))lb.push(x)});S.lib=lb}
function flush(){if(CL&&ptm){clearTimeout(ptm);ptm=null;cloudPush()}}
async function switchChar(id){if(id===CID||LOCKED)return;flush();const prev=S;await loadChar(id);shareFrom(prev);saveIdx();save();VIEW='sheet';render();cloudSync()}
function newChar(){if(LOCKED)return;flush();const prev=S,id='c'+Date.now().toString(36);IDX.list.push({id,n:''});CID=id;IDX.cur=id;S=blank();if(prev.theme)S.theme={...prev.theme};TS=0;CL=DBH?cdoc(id):null;shareFrom(prev);saveIdx();save();VIEW='sheet';render();cloudSync()}
function dupChar(){if(LOCKED)return;flush();const prev=S,id='c'+Date.now().toString(36),cp=JSON.parse(JSON.stringify(S)),nm=(prev.i.nome||'Personaggio')+' (copia)';IDX.list.push({id,n:nm});CID=id;IDX.cur=id;S=cp;S.i.nome=nm;TS=0;CL=DBH?cdoc(id):null;saveIdx();save();VIEW='sheet';render();cloudSync()}
async function delChar(){if(LOCKED)return;const nm=S.i.nome||'questo personaggio';
 if(IDX.list.length<=1){if(!confirm('È l\'unico personaggio: lo azzero? La libreria e il glossario restano.'))return;const l=S.lib,g=S.gloss,x=S.glx;S=blank();S.lib=l;S.gloss=g;S.glx=x;save();render();return}
 if(!confirm('Eliminare «'+nm+'»? Non si può annullare.'))return;const old=CID;IDX.list=IDX.list.filter(x=>x.id!==old);const nid=IDX.list[0].id;
 try{localStorage.removeItem(lk(old));localStorage.removeItem(lk(old)+'_ts')}catch(e){}
 if(DBH){try{await cdoc(old).delete()}catch(e){}}
 await loadChar(nid);saveIdx();VIEW='sheet';render();cloudSync()}
/* --- blocco con password --- */
function showLock(){let o=document.getElementById('lockov');if(!o){o=document.createElement('div');o.id='lockov';document.body.appendChild(o)}
 o.innerHTML=`<div class="lockbox"><h2>Scheda protetta</h2><p class="empty">Inserisci la password per aprire i tuoi personaggi.</p><input id="lkp" type="password" placeholder="Password" autocomplete="current-password"><button id="lkb" class="p" style="margin-top:8px;width:100%">Sblocca</button><p id="lke" class="empty" style="color:var(--acc);min-height:1.2em"></p><button id="lkf" class="g">Ho dimenticato la password</button></div>`;
 const go=async()=>{const pw=o.querySelector('#lkp').value;if(!pw)return;o.querySelector('#lke').textContent='…';const ok=await tryUnlock(pw);if(!ok){o.querySelector('#lke').textContent='Password errata.';o.querySelector('#lkp').select()}};
 o.querySelector('#lkb').onclick=go;o.querySelector('#lkp').onkeydown=e=>{if(e.key==='Enter')go()};o.querySelector('#lkf').onclick=forgotLock;
 setTimeout(()=>{const i=o.querySelector('#lkp');if(i)i.focus()},50)}
const hideLock=()=>{const o=document.getElementById('lockov');if(o)o.remove()};
async function tryUnlock(pw){try{const key=await kdf(pw,LOCKCFG);if(await decWith(key,LOCKCFG.check)!=='ok')return false;ENC=key}catch(e){return false}
 LOCKED=false;const ix=await readKey(KEY+'_idx');if(ix&&Array.isArray(ix.list)&&ix.list.length)IDX=ix;if(!IDX.list.some(x=>x.id===IDX.cur))IDX.cur=IDX.list[0].id;
 await loadChar(IDX.cur);hideLock();render();cloudSync();loadShared();return true}
function lockNow(){clearTimeout(ptm);ptm=null;ENC=null;LOCKED=true;S=blank();IDX={cur:'main',list:[{id:'main',n:''}],ts:0};CL=null;document.getElementById('dlg').close&&document.getElementById('dlg').close();showLock()}
function forgotLock(){if(!confirm('Se hai dimenticato la password i personaggi cifrati NON si possono recuperare. Vuoi cancellare tutti i dati protetti da questo dispositivo e ripartire da zero?'))return;
 try{Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k))}catch(e){}
 if(DBH){[ldoc(),idoc(),DBH.doc('data/users/'+UIDV+'/sheet')].forEach(d=>{try{d.delete()}catch(e){}})}
 LOCKCFG=null;LOCKED=false;ENC=null;IDX={cur:'main',list:[{id:'main',n:''}],ts:0};CID='main';S=blank();TS=0;CL=DBH?cdoc('main'):null;hideLock();render()}
async function gatherPlain(){const out=[];for(const x of IDX.list){let js=null,ts=+localStorage.getItem(lk(x.id)+'_ts')||Date.now();
  if(x.id===CID){js=JSON.stringify(S);ts=TS||Date.now()}else{const o=await readLocal(x.id);if(o)js=JSON.stringify(o);else if(DBH){try{const sn=await cdoc(x.id).get();js=await unpackDoc(sn.exists?sn.data():null)}catch(e){}}}
  if(js!=null)out.push({id:x.id,js,ts})}return out}
async function writeAll(list){for(const x of list){try{localStorage.setItem(lk(x.id),ENC?await encWith(ENC,x.js):x.js);localStorage.setItem(lk(x.id)+'_ts',String(x.ts))}catch(e){}if(DBH){try{await cdoc(x.id).set(await packDoc(x.js,x.ts))}catch(e){}}}
 IDX.ts=Date.now();persistIdx();await wq;if(DBH){try{await idoc().set(await packDoc(JSON.stringify(IDX),IDX.ts))}catch(e){}}}
async function setLock(newpw){const plains=await gatherPlain();
 if(newpw){const cfg={salt:b64(crypto.getRandomValues(new Uint8Array(16))),iter:200000,ts:Date.now()},key=await kdf(newpw,cfg);cfg.check=await encWith(key,'ok');ENC=key;LOCKCFG=cfg;try{localStorage.setItem(KEY+'_lock',JSON.stringify(cfg))}catch(e){}if(DBH){try{await ldoc().set(cfg)}catch(e){}}}

 if(d.delglx!==undefined){const gx=S.glx[+d.delglx];if(gx&&gx.sh){S.i.glxOff=S.i.glxOff||[];S.i.glxOff.push(gx.n)}S.glx.splice(+d.delglx,1);save();drawGloss();return}

 if(d.dellang!==undefined){const l=(S.lang||[])[+d.dellang];if(l&&l.a){S.i.langOff=S.i.langOff||[];S.i.langOff.push(l.n)}S.lang.splice(+d.dellang,1);save();render();return}

 if(d.pick){const[t,i]=d.pick.split('.'),c=catalog(t)[+i];if(t==='items'&&PACKS[c.n]){PACKS[c.n].forEach(s=>{const x=qi(s);S.items.push({n:x.n,q:x.q,m:c.n+' (dal catalogo)',d:''})});save();document.getElementById('dlg').close();render();return}S[t].push({q:c.q,n:c.n,m:c.m,d:c.d,g:d.g||undefined,wd:c.wd?{...c.wd}:undefined,ad:c.ad?{...c.ad}:undefined,o:{n:c.n,m:c.m,d:c.d}});save();document.getElementById('dlg').close();render()}

function openAdd(t,g){const inG=x=>t!=='features'||!g||(g==='sp'?((x.k||'').startsWith('Specie|')||x.g==='sp'):g==='bg'?x.g==='bg':!((x.k||'').startsWith('Specie|')||x.g==='sp'||x.g==='bg'));const dl=document.getElementById('dlg'),dc=document.getElementById('dc');
 const sv=()=>(dc.querySelector('#cf')||{}).value||'';
 const draw=f=>{const c=catalog(t);dc.querySelector('.cat').innerHTML=c.map((x,i)=>({x,i})).filter(({x})=>inG(x)&&(!sv()||x.k===sv())&&(t!=='spells'||(((dc.querySelector('#sl')||{}).value||'')===''||+x.m===+dc.querySelector('#sl').value)&&(!(dc.querySelector('#sk')||{}).value||!x.cl||x.cl.includes(dc.querySelector('#sk').value)))&&(!f||(x.n+x.m+x.d).toLowerCase().includes(f.toLowerCase()))).map(({x,i})=>`<button data-pick="${t}.${i}" data-g="${g||''}">${esc(x.n)}<small>${t==='spells'?(x.m==0?'Trucchetto':'Liv. '+x.m):esc(x.m)} · ${esc(x.d).slice(0,80)}</small></button>`).join('')||'<p class="empty" style="padding:8px">Nessun risultato.</p>'};
 dc.innerHTML=`<h3>Aggiungi: ${LISTS[t]}</h3><input id="q" placeholder="Cerca nella libreria" style="margin-top:8px">${t==='features'?cf(g):t==='feats'?cg():t==='spells'?spf():t==='items'?ci():''}<div class="cat"></div>
 <button id="nw" class="p">Crea voce personalizzata</button>${t==='items'?' <button id="nwW">Crea arma</button> <button id="nwA">Crea armatura</button>':''}
 <details style="margin-top:10px"><summary>Importa elenco dal manuale</summary><p class="empty">Una voce per riga: <code>nome | livello o tipo | descrizione</code></p><textarea id="bulk" rows="5"></textarea><button id="bi">Importa nella scheda e nella libreria</button></details>
 <div style="text-align:right;margin-top:10px"><button id="cl">Chiudi</button></div>`;
 {const sk=dc.querySelector('#sk'),c0=(S.i.classe||'').toLowerCase();if(t==='spells'&&sk&&[...sk.options].some(o=>o.value===c0))sk.value=c0;const s=dc.querySelector('#cf');if(t==='features'&&s){const v=g==='sp'?'Specie|'+S.i.specie:g==='cl'?S.i.classe+'|':g==='bg'?'Origine|'+S.i.background:'';if([...s.options].some(o=>o.value===v))s.value=v}}
 draw('');dc.querySelector('#q').oninput=e=>draw(e.target.value);dc.querySelectorAll('#sl,#sk').forEach(s=>s.onchange=()=>draw(dc.querySelector('#q').value));const cfe=dc.querySelector('#cf');if(cfe)cfe.onchange=()=>draw(dc.querySelector('#q').value);
 dc.querySelector('#nw').onclick=()=>{S[t].push({n:'',m:t==='spells'?1:'',d:'',g:g||undefined});save();dl.close();render()};
 if(t==='items'){dc.querySelector('#nwW').onclick=()=>openBuilder('w');dc.querySelector('#nwA').onclick=()=>openBuilder('a')}
 dc.querySelector('#bi').onclick=()=>{dc.querySelector('#bulk').value.split('\n').map(r=>r.split('|').map(s=>s.trim())).filter(r=>r[0]).forEach(r=>{const x={n:r[0],m:t==='spells'?(parseInt(r[1])||0):(r[1]||''),d:r.slice(2).join(' | '),g:g||undefined};S[t].push(x);S.lib.push({t,...x})});save();dl.close();render()};
 dc.querySelector('#cl').onclick=()=>dl.close();dl.showModal()}

document.getElementById('bk').onclick=()=>{const dl=document.getElementById('dlg'),dc=document.getElementById('dc');
 dc.innerHTML=`<h3>Backup</h3><p class="empty">Copia questo testo e conservalo: incollandolo qui sotto puoi ripristinare la scheda (anche su un altro dispositivo).</p><textarea id="js" rows="9">${esc(JSON.stringify(S))}</textarea>
 <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end"><button id="ld" class="p">Carica dal testo</button><button id="cl">Chiudi</button></div><p id="er" class="empty"></p>`;
 dc.querySelector('#cl').onclick=()=>dl.close();

render();
